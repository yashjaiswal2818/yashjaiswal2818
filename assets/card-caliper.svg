<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 206" width="420" height="206" role="img" aria-label="Caliper: an air-gapped agent for industrial docs. it cites its sources and refuses to guess."><defs><g id="fo"><rect x="4" y="15" width="56" height="35" rx="4" fill="#0a3c8c" opacity=".16"/>
<path d="M4 8a4 4 0 0 1 4-4h15.2a4 4 0 0 1 2.9 1.2l3.4 3.6a4 4 0 0 0 2.9 1.2H56a4 4 0 0 1 4 4v3H4V8Z" fill="#3FA3F0"/>
<rect x="4" y="13" width="56" height="35" rx="4" fill="#62B8F7"/><rect x="4" y="13" width="56" height="2" rx="1" fill="#8FCDFA"/></g><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dy="4" stdDeviation="5" flood-color="#0a2a6e" flood-opacity=".12"/></filter><clipPath id="cl"><rect x="6" y="6" width="408" height="192" rx="16"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#7DB7F7" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>
.bob{animation:bob 3.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
.sheen{animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-160px) skewX(-18deg)}22%,100%{transform:translateX(580px) skewX(-18deg)}}
.nudge{animation:nudge 1.8s ease-in-out infinite alternate}
@keyframes nudge{from{transform:translateX(0)}to{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g filter="url(#sh)"><rect x="6" y="6" width="408" height="192" rx="16" fill="#fff"/></g>
<rect x="6.5" y="6.5" width="407" height="191" rx="15.5" fill="none" stroke="#000" stroke-opacity=".08"/>
<g clip-path="url(#cl)"><rect class="sheen" style="animation-delay:5.6s" x="0" y="0" width="70" height="210" fill="url(#shg)"/></g>
<g class="bob" style="animation-delay:-2.8s"><g transform="translate(26 26) scale(.7)"><use href="#fo"/></g></g>
