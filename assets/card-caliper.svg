<circle class="pulse" cx="88" cy="68" r="4" fill="#a855f7"/><circle cx="88" cy="68" r="4" fill="#a855f7"/>
<text x="98" y="72.5" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280">Smart India Hackathon</text>
<text x="26" y="106" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#374151">an air-gapped agent for industrial docs. it</text>
<text x="26" y="127" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#374151">cites its sources and refuses to guess.</text>
